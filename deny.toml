[advisories]
# Narrow inherited libSQL exceptions; see docs/DEPENDENCIES.md.
ignore = [
]

[licenses]
allow = [
    "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC",
    "MIT", "MPL-2.0", "OpenSSL", "Unicode-3.0", "Unicode-DFS-2016", "Unlicense", "Zlib",
    "LGPL-3.0-only WITH LGPL-3.0-linking-exception",
]
confidence-threshold = 0.8

# Unpublished workspace crates have repository-reviewed FSL/LGPL licences.
[licenses.private]
ignore = true
