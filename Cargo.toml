[package]
name = "cblc"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Balance library: accounts, events and policies for zero-knowledge accounting, managed by cvld"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cblc"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[features]
default = []
# Storage/authorization test harness only; no production extension relation ships.
extension-issuer-harness = []

[dependencies]
cthl = { git = "https://github.com/corbet-foss/cthl", rev = "7f1a38de4285dee4b15ee8f9e82c1cb257513644" }
cpns = { git = "https://github.com/corbet-foss/cpns", rev = "23968a9fa338791e70078c6070a6f1f3cf185ff7", default-features = false }
futures = "0.3"
czkp = { git = "https://github.com/corbet-foss/czkp", rev = "8444749e98ea192353ccc82c56a33a43fcaa588c" }
cvfy = { git = "https://github.com/corbet-foss/cvfy", rev = "03d1f87e5edfa5a60ddd9e0a71d23864f0dbfb69" }
cssr = { git = "https://github.com/corbet-foss/cssr", rev = "b1e062fc1c0f581257668389988fcb17550711fa" }
crlt = { git = "https://github.com/corbet-foss/crlt", rev = "6b94dacd7fa04aa8847c62c6471a1fc5c0f6c9dc" }
data-encoding = "2.9"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
