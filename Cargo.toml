[package]
name = "cblc"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Balance library: accounts, events and policies for zero-knowledge accounting, managed by cvld"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cblc"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[features]
default = []
schema = ["dep:utoipa", "dep:schemars", "czkp/schema"]

[dependencies]
utoipa = { version = "6", optional = true }
schemars = { version = "1", optional = true }
cthl = { git = "https://github.com/corbet-foss/cthl", branch = "main" }
cpns = { git = "https://github.com/corbet-foss/cpns", branch = "main", default-features = false }
futures = "0.3"
czkp = { git = "https://github.com/corbet-foss/czkp", branch = "main" }
cvfy = { git = "https://github.com/corbet-foss/cvfy", branch = "main" }
cssr = { git = "https://github.com/corbet-foss/cssr", branch = "main" }
crlt = { git = "https://github.com/corbet-foss/crlt", branch = "main" }
data-encoding = "2.9"
ed25519-dalek = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
tempfile = "3"
