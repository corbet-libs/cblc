[package]
name = "cblc"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Balance library: accounts, events and policies for zero-knowledge accounting, managed by cvld"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cblc"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
czkp = { git = "https://github.com/corbet-foss/czkp", branch = "main" }
cvfy = { git = "https://github.com/corbet-foss/cvfy", branch = "main" }
cssr = { git = "https://github.com/corbet-foss/cssr", branch = "main" }
crlt = { git = "https://github.com/corbet-foss/crlt", rev = "6b94dacd7fa04aa8847c62c6471a1fc5c0f6c9dc" }
data-encoding = "2.9"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
