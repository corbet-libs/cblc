[package]
name = "cblc"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Balance library: accounts, events and policies for zero-knowledge accounting, managed by cvld"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cblc"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
cthl = { git = "https://github.com/corbet-foss/cthl", rev = "a41533a255cefc0757078205bff87c03e6c7bbbe" }
cpns = { git = "https://github.com/corbet-foss/cpns", rev = "d68a3f3a2df322c513d0e754e452ee02aab7a5b9", default-features = false }
futures = "0.3"
czkp = { git = "https://github.com/corbet-foss/czkp", rev = "e1782da1f7193a26ca0aea23137784896b780c03" }
cvfy = { git = "https://github.com/corbet-foss/cvfy", rev = "5b31dde13fd9bafc115dbc8ff7f51cccc3debf29" }
cssr = { git = "https://github.com/corbet-foss/cssr", rev = "6dbff220fc47dfb6e44403ecde9eb3af13cd75f5" }
crlt = { git = "https://github.com/corbet-foss/crlt", rev = "80dc046d6ab53b3ea530c45bf3d7038c8b2c61b2" }
data-encoding = "2.9"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
