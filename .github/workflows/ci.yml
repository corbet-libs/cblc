name: ci
permissions:
  contents: read
concurrency:
  group: ci
  cancel-in-progress: false
  queue: max
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: npm update --package-lock-only --ignore-scripts --no-audit --no-fund
    - name: Resolve one fresh dependency snapshot
      run: 'python3 .github/check-first-party.py

        cargo update

        rustc --version > resolver.txt

        cargo --version >> resolver.txt

        date -u +%FT%TZ >> resolver.txt

        sha256sum Cargo.lock >> resolver.txt'
    - uses: actions/upload-artifact@v4
      with:
        name: resolved-lock
        path: 'Cargo.lock

          resolver.txt

          package-lock.json'
        retention-days: 7
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: cargo metadata --locked --format-version 1 > dependency-metadata.json
    - run: node .github/check-advisory-exposure.mjs
    - run: cargo deny --locked check advisories licenses
    needs:
    - resolve
    - check
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - run: python3 .github/check-first-party.py
    needs:
    - resolve
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CBLC_PROOF_DIRECTORY: ${{ github.workspace }}/.proof-test
      CBLC_LEDGER_FIXTURES: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    - run: 'rustc --version

        cargo fmt --check || { cargo fmt; git diff > formatting.patch; exit 1; }'
    - run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: Check schema projection before constructing expensive proofs
      run: cargo test --locked --all-features --test service_schema generated_projection_preserves_every_serde_constraint
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: npm ci --ignore-scripts --no-audit --no-fund
    - run: npm test
    - uses: actions/cache/restore@v4
      id: proof-cache
      with:
        path: .proof-test
        key: proofs-v1-${{ runner.os }}-${{ hashFiles('experiments/private-accounting/account-state/**',
          'runtime/accounting/**', 'tests/real-proof.mjs', 'tests/holder/**', 'package*.json')
          }}
    - if: steps.proof-cache.outputs.cache-hit != 'true'
      run: node tests/real-proof.mjs
    - uses: actions/cache/save@v4
      if: steps.proof-cache.outputs.cache-hit != 'true'
      with:
        path: .proof-test
        key: ${{ steps.proof-cache.outputs.cache-primary-key }}
    - run: cargo test --locked --all-features --no-fail-fast -- --test-threads=2
    - uses: actions/cache/restore@v4
      id: extension-cache
      with:
        path: .extension-test
        key: extension-public-v1-${{ runner.os }}-${{ hashFiles('circuits/extensions/**',
          'runtime/extensions/**', 'tests/extensions-proof.mjs', 'tests/holder/extension-checkpoint.mjs', 'tests/common/mod.rs',
          'examples/extension_issuer.rs', 'package*.json') }}
    - run: node runtime/extensions/compile.mjs
      if: steps.extension-cache.outputs.cache-hit != 'true'
    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack
      if: steps.extension-cache.outputs.cache-hit != 'true'
    - run: wasm-pack build node_modules/@corbet-labs/cwlt --target web --release --out-dir
        "$PWD/.extension-wasm"
      if: steps.extension-cache.outputs.cache-hit != 'true'
    - run: cargo build --locked --example extension_issuer
    - name: Record proof construction provenance
      if: steps.extension-cache.outputs.cache-hit != 'true'
      run: 'git rev-parse HEAD > .extension-test/source.txt

        sha256sum package-lock.json >> .extension-test/source.txt'
    - run: node tests/extensions-proof.mjs
      if: steps.extension-cache.outputs.cache-hit != 'true'
    - uses: actions/cache/save@v4
      if: steps.extension-cache.outputs.cache-hit != 'true'
      with:
        path: .extension-test
        key: ${{ steps.extension-cache.outputs.cache-primary-key }}
    - name: Reverify unchanged public proof fixtures against the current issuer
      if: steps.extension-cache.outputs.cache-hit == 'true'
      run: CBLC_EXTENSION_ISSUER="$PWD/target/debug/examples/extension_issuer" node
        tests/replay-extensions.mjs
    - name: Check active extension boundaries using the real public proofs
      run: cargo run --locked --all-features --example extension_adversaries
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-lock
        path: 'Cargo.lock

          package-lock.json

          .extension-test/results.json

          .extension-test/manifest.json

          '
    - uses: actions/upload-artifact@v4
      with:
        name: proof-fixtures
        path: .proof-test/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: formatting
        path: formatting.patch
    - uses: actions/upload-artifact@v4
      with:
        name: extension-public-proofs
        path: .extension-test/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    needs:
    - resolve
  coverage:
    needs:
    - resolve
    - check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: actions/download-artifact@v4
      with:
        name: proof-fixtures
        path: .proof-test
    - uses: actions/download-artifact@v4
      with:
        name: extension-public-proofs
        path: .extension-test
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: npm ci --ignore-scripts --no-audit --no-fund
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: coverage
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - run: 'rustc --version

        cargo llvm-cov --version'
    - name: Measure real native round trips and failure paths
      run: |
        set -euo pipefail
        source <(cargo llvm-cov show-env --sh --branch --no-cfg-coverage --no-cfg-coverage-nightly)
        cargo llvm-cov clean --workspace
        cargo test --locked --workspace --all-features -- --test-threads=2
        cargo build --locked --all-features --example extension_issuer --example extension_adversaries --message-format=json > instrumented-build.json
        CBLC_EXTENSION_ISSUER="$(jq -ers 'map(select(.reason == "compiler-artifact" and .target.name == "extension_issuer" and .executable != null)) | if length == 1 then .[0].executable else error("Expected exactly one issuer executable") end' instrumented-build.json)"
        export CBLC_EXTENSION_ISSUER
        test -x "$CBLC_EXTENSION_ISSUER"
        node tests/replay-extensions.mjs
        adversaries="$(jq -ers 'map(select(.reason == "compiler-artifact" and .target.name == "extension_adversaries" and .executable != null)) | if length == 1 then .[0].executable else error("Expected exactly one adversary executable") end' instrumented-build.json)"
        "$adversaries"
    - name: Retain raw coverage even when a real execution fails
      if: always()
      run: |
        source <(cargo llvm-cov show-env --sh --branch --no-cfg-coverage --no-cfg-coverage-nightly)
        cargo llvm-cov report --branch --ignore-filename-regex '/tests/|/examples/' --json --output-path coverage.json
    - name: Retain source coverage diagnostics from the same execution
      if: always()
      run: |
        source <(cargo llvm-cov show-env --sh --branch --no-cfg-coverage --no-cfg-coverage-nightly)
        cargo llvm-cov report --branch --ignore-filename-regex '/tests/|/examples/' --lcov --output-path coverage.lcov
    - name: Retain independent annotated source inventory
      if: always()
      run: |
        source <(cargo llvm-cov show-env --sh --branch --no-cfg-coverage --no-cfg-coverage-nightly)
        cargo llvm-cov report --branch --ignore-filename-regex '/tests/|/examples/' --text --output-path coverage.txt
    - name: Require complete source line and branch coverage
      run: |
        python3 .github/test-source-coverage.py
        python3 .github/check-source-coverage.py coverage.lcov coverage.json coverage.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage
        path: 'coverage.json

          Cargo.lock

          resolver.txt

          coverage.lcov

          coverage.txt

          instrumented-build.json'
        retention-days: 7
    env:
      CBLC_PROOF_DIRECTORY: ${{ github.workspace }}/.proof-test
'on':
  push:
    branches:
    - main
    - ci/**
  pull_request: null
  workflow_dispatch: null
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
