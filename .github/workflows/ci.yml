name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CBLC_PROOF_DIRECTORY: ${{ github.workspace }}/.proof-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - run: rustc --version && cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: proof-cache
        with:
          path: .proof-test
          key: proofs-v1-${{ runner.os }}-${{ hashFiles('experiments/private-accounting/account-state/**', 'runtime/accounting/**', 'tests/real-proof.mjs', 'tests/holder/**', 'package*.json') }}
      - if: steps.proof-cache.outputs.cache-hit != 'true'
        run: node tests/real-proof.mjs
      - run: cargo test --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-lock
          path: |
            Cargo.lock
            package-lock.json

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-deny
      - run: cargo deny check advisories licenses
